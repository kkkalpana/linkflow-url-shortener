name: Keep Alive Ping

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping-service:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          URL="${{ secrets.BACKEND_HEALTH_URL || 'https://linkflow-url-shortener.onrender.com/api/health' }}"
          if [ -z "$URL" ]; then
            echo "BACKEND_HEALTH_URL is not configured."
            exit 1
          fi

          echo "Sending keep-alive ping to $URL..."
          if ! HTTP_RESPONSE=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -w "\n%{http_code}" "$URL"); then
            echo "Keep-alive request failed. Check that BACKEND_HEALTH_URL is a valid URL."
            exit 1
          fi

          BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)

          echo "Response Status: $STATUS"
          echo "Response Body: $BODY"

          if [ "$STATUS" -ne 200 ]; then
            echo "Expected status 200 but received $STATUS"
            exit 1
          else
            echo "Keep-alive ping successful!"
          fi
